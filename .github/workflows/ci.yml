name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # nooa requires Python >=3.12,<3.14.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Installs the full runtime (including nooa) so the nooa regression
        # tests run too; the framework-agnostic tests need only pydantic.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Dummy key: agent construction builds an LLM client but makes no request.
        env:
          ANTHROPIC_API_KEY: test-not-called
        run: python -m pytest -q
