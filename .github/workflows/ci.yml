name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The unit tests cover the framework-agnostic models, logic, config,
        # and state — none of which require nooa — so we install only pydantic
        # and pytest here.
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0,<3.0" "pytest>=8.0,<9.0"

      - name: Run tests
        run: python -m pytest -q
