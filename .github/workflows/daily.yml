name: Daily Art Manager

# Runs the agent's daily workflow on a schedule (and on demand), so it works
# without any computer of your own. Results print to the run log and, when Zoho
# Mail is configured, are emailed to you as a daily brief.
#
# Keys are read from repository Secrets (Settings -> Secrets and variables ->
# Actions), never committed:
#   ANTHROPIC_API_KEY            - required for the AI parts (board, briefs)
#   ART_MANAGER_SEARCH_API_KEY   - optional: real ND buyer lookup (Google Places)
#   ZOHO_MAIL_USER               - optional: your Zoho address, e.g. cody@codycarlson.art
#   ZOHO_MAIL_PASSWORD           - optional: a Zoho APP password (not the login)
# Missing optional keys just degrade gracefully — the run still works.

on:
  schedule:
    # 13:00 UTC daily ≈ 8:00am Central (7:00am during standard time).
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Don't pile up overlapping runs if one is slow.
concurrency:
  group: daily-art-manager
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Needed to push the agent's memory (state + playbook) to the studio-state branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the agent's memory (state + learned playbook) from the
      # studio-state branch, so each run continues where the last left off.
      - name: Restore studio memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/mem
          if git clone --depth=1 --branch studio-state "$repo_url" /tmp/mem 2>/dev/null; then
            for f in art_manager_state.json PLAYBOOK.md; do
              if [ -f "/tmp/mem/$f" ]; then cp "/tmp/mem/$f" "./$f"; echo "restored $f"; fi
            done
          else
            echo "no studio-state branch yet — starting fresh"
          fi

      - name: Run the daily workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ART_MANAGER_SEARCH_API_KEY: ${{ secrets.ART_MANAGER_SEARCH_API_KEY }}
          ZOHO_MAIL_USER: ${{ secrets.ZOHO_MAIL_USER }}
          ZOHO_MAIL_PASSWORD: ${{ secrets.ZOHO_MAIL_PASSWORD }}
          # Daily working mix (set repo Variables to override; defaults here).
          ART_MANAGER_DAILY_SCULPTURES: ${{ vars.ART_MANAGER_DAILY_SCULPTURES || '2' }}
          ART_MANAGER_DAILY_PAINTINGS: ${{ vars.ART_MANAGER_DAILY_PAINTINGS || '4' }}
        # Capture the brief so the next step can email it, while still showing
        # it in the run log.
        run: python -m agents.run_daily | tee daily_brief.txt

      - name: Email the brief (when Zoho is configured)
        if: always()
        env:
          ZOHO_MAIL_USER: ${{ secrets.ZOHO_MAIL_USER }}
          ZOHO_MAIL_PASSWORD: ${{ secrets.ZOHO_MAIL_PASSWORD }}
        run: |
          python - <<'PY'
          from agents import mail
          import os, pathlib
          # Emails YOU your own brief — this never sends outreach to buyers.
          if mail.mail_configured():
              body = pathlib.Path("daily_brief.txt").read_text(encoding="utf-8")
              mail.send_email(
                  os.environ["ZOHO_MAIL_USER"],
                  "Art Manager — daily brief",
                  body or "(no output)",
              )
              print("Emailed the daily brief.")
          else:
              print("Zoho not configured; skipping the email (brief is in the log above).")
          PY

      - name: Save the brief as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: daily_brief.txt
          if-no-files-found: ignore

      # Persist the agent's memory (state + updated playbook) back to the
      # studio-state branch so the next run remembers today.
      - name: Save studio memory
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/mem
          if ! git clone --depth=1 --branch studio-state "$repo_url" /tmp/mem 2>/dev/null; then
            git clone --depth=1 "$repo_url" /tmp/mem
            ( cd /tmp/mem && git checkout --orphan studio-state && git rm -rf . >/dev/null 2>&1 || true )
          fi
          copied=0
          for f in art_manager_state.json PLAYBOOK.md; do
            if [ -f "./$f" ]; then cp "./$f" "/tmp/mem/$f"; copied=1; fi
          done
          if [ "$copied" = "0" ]; then echo "nothing to save"; exit 0; fi
          cd /tmp/mem
          git config user.name "art-manager-bot"
          git config user.email "art-manager-bot@users.noreply.github.com"
          # -f because art_manager_state.json is gitignored in the main repo.
          git add -f art_manager_state.json PLAYBOOK.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no memory changes"; exit 0; fi
          git commit -m "studio memory $(date -u +%FT%TZ)"
          git push "$repo_url" HEAD:studio-state
          echo "studio memory saved"
